<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="direzione.css" rel="stylesheet">
    <title>Direzione</title>
</head>
<body>
    <a href="index.html" class="bottone-verde">Indietro</a>
    <div class="contenitore">
        <h1 class="listaClienti">Accesso Direzione</h1>

        <form action="javascript:void(0)" method="POST" id="form-login">
            <div class="campo">
                <label for="username">Username:</label>
                <input type="text" id="username" value="GoldRelax" disabled>
            </div>

            <div class="campo">
                <label for="password">Password:</label>
                <input type="password" id="password" placeholder="Inserisci la password" required>
            </div>

            <button type="submit" class="bottone">Accedi</button>
        </form>
    </div>
</body>
</html>

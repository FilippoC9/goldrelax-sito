<!DOCTYPE html>
<html lang="it">
<head>

            background: linear-gradient(135deg, #ff9ecd, #ff6fa8);
            padding: 60px 20px;
            text-align: center;

        }
        .header h1 {
            margin: 0;

            .header h1 { font-size: 2.2rem; }

    </style>
</head>
<body>

</html>
